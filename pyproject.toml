[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sennet-chat"
version = "0.1.0"
description = "SenNet Chat CLI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["neo4j>=5.28.6,<6.0", "PyYAML>=6.0.3,<7.0.0", "requests>=2.34.2,<2.35.0"]

[project.optional-dependencies]
dev = ["black>=26.5.1,<27.0.0", "isort>=8.0.1,<9.0.0", "flake8>=7.3.0,<8.0.0"]

[project.scripts]
fileindex = "fileindex.fileindex:main"

[tool.hatch.build.targets.wheel]
packages = ["fileindex"]

# Black
[tool.black]
line-length = 100
target-version = ["py313"]

[tool.isort]
profile = "black"
line_length = 100

# flake8 configuration in the .flake8 file
